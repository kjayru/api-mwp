name: mwp

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: mwp
      POSTGRES_PASSWORD: mwp
      POSTGRES_DB: mwp
    # 5433 on the host: 5432 is usually taken by a local PostgreSQL install.
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mwp -d mwp']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
